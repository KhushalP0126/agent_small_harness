[package]
name = "harness-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
anyhow = "1"
ratatui-image = { version = "=8.0.2", default-features = false, features = ["crossterm", "image-defaults"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
image = "0.25"
resvg = "0.47"
usvg = "0.47"
tiny-skia = "0.11"

[dev-dependencies]
tempfile = "3"
