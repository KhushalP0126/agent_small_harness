<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect x="1" y="1" width="126" height="126" rx="28" fill="#090D14" stroke="#1E293B" stroke-width="1.5"/>

  <!-- orbit ring connecting the three agents -->
  <path d="M 64,30 Q 83.85,52.5 93.4,81 Q 64,86.1 34.6,81 Q 44.15,52.5 64,30 Z"
        fill="none" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>

  <!-- human checkpoint (top) -->
  <circle cx="64" cy="30" r="7.5" fill="#60A5FA"/>
  <!-- local worker (bottom right) -->
  <circle cx="93.4" cy="81" r="7.5" fill="#2DD4BF"/>
  <!-- api architect (bottom left) -->
  <circle cx="34.6" cy="81" r="7.5" fill="#C084FC"/>

  <!-- shared center: where all three meet -->
  <circle cx="64" cy="64" r="5" fill="#E2E8F0" filter="url(#glow)"/>
</svg>
