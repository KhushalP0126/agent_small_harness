[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-small-harness"
version = "0.1.0"
description = "Python-first verified code-generation and repair harness."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn==0.35.0",
  "tree-sitter==0.25.2",
  "tree-sitter-c==0.24.2",
  "tree-sitter-cpp==0.23.4",
  "pygame==2.6.1",
]

[project.optional-dependencies]
formal = [
  "deal",
  "crosshair-tool",
  "pylint",
]
browser = [
  "kernel",
]

[tool.setuptools]
packages = [
  "agents",
  "api",
  "backends",
  "engines",
  "kernel",
  "prompt",
  "validation",
]
